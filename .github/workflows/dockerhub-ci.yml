name: Docker Hub

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_LUIS }}
          password: ${{ secrets.DOCKERHUB_TOKEN_LUIS }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./dockerfile-luis/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_LUIS }}/as241s5_aej_33-fe:latest
            ${{ secrets.DOCKERHUB_LUIS }}/as241s5_aej_33-fe:${{ github.sha }}
